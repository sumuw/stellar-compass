baseURL = 'https://sumuw.github.io/stellar-compass/'
locale = 'zh-CN'
title = 'Stellar Compass'
defaultContentLanguage = 'zh-cn'
enableRobotsTXT = true
enableGitInfo = false
# 榜单 front matter 的 date 是纯日历日期，含义是"榜单归属日"而非发布时间。
# 无时区的日期一律按下面的 timeZone 解析为该日 00:00(+08:00)，与运行环境的
# TZ 无关（GitHub Actions 是 UTC，本机是 +08），解析结果不会因环境漂移。
# 每日自动化在北京时间 05:05 构建"昨天"的榜单，归属日 00:00(+08:00) 恒早于
# 构建时刻，因此不会被判为未来内容——不需要 buildFuture 豁免，
# Hugo 对未来内容的默认拦截保持生效（误填未来日期的页面不会上线）。
timeZone = 'Asia/Shanghai'

[pagination]
  pagerSize = 20

[permalinks]
  rankings = '/rankings/:slug/'

[taxonomies]
  category = 'categories'
  period = 'periods'
  tag = 'tags'

[params]
  description = '追踪 GitHub、AI 与数字文化趋势的排行榜内容站。'

[params.categoryLabels]
  github = 'GitHub'
  movie = '影视'
  tv = '剧集'
  ai = 'AI'
  film-radar = '影视雷达'
  other = '其他'

[params.periodLabels]
  daily = '日榜'
  weekly = '周榜'
  monthly = '月榜'

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
  term = ['HTML', 'RSS']

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
