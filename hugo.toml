baseURL = 'https://sumuw.github.io/stellar-compass/'
locale = 'zh-CN'
title = 'Stellar Compass'
defaultContentLanguage = 'zh-cn'
enableRobotsTXT = true
enableGitInfo = false
# 榜单 front matter 的 date 是"榜单日 08:00(+08:00)"，而每日自动化在北京时间 05:05
# （UTC 前一天 21:05）构建，此时 date 仍在未来 ~3 小时，Hugo 默认跳过未来内容，
# 会导致线上始终晚一天。榜单日期是标签而非真实发布时间，直接放行未来内容。
buildFuture = true

[pagination]
  pagerSize = 20

[permalinks]
  rankings = '/rankings/:slug/'

[taxonomies]
  category = 'categories'
  period = 'periods'
  tag = 'tags'

[params]
  description = '追踪 GitHub、AI 与数字文化趋势的排行榜内容站。'

[params.categoryLabels]
  github = 'GitHub'
  movie = '影视'
  tv = '剧集'
  ai = 'AI'
  film-radar = '影视雷达'
  other = '其他'

[params.periodLabels]
  daily = '日榜'
  weekly = '周榜'
  monthly = '月榜'

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
  term = ['HTML', 'RSS']

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
